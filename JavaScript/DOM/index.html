<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<script>
    function display()
    {
        let name = document.getElementById("name").value;
        document.innerHTML = <h1>${name}</h1>;
    }
</script>
<body>
    <div id="form">
        <h1>Student Registration Form</h1>
        <form action="">
            <label for="">
                Name: <input type="text" name="name" id="name">
            </label><br><br>
            <label for="Branch" id="branch" name="branch">
                Branch: <select name="branch" id="branch">
                    <option value="CSE" id="branch">CSE</option>
                    <option value="ECE">ECE</option>
                    option value="MECH">MECH</option>
                    <option value="CIVIL">CIVIL</option>
                    <option value="IT">IT</option>
                    <option value="MCA">MCA</option>
                    </select>
            </label><br><br>
            <label for="Skills">
                Skills :
                HTML <input type="checkbox" name="skills" id="skills">
                CSS <input type="checkbox" name="skills" id="skills">
                C++ <input type="checkbox" name="skills" id="skills">
                Java <input type="checkbox" name="skills" id="skills">
                Python <input type="checkbox" name="skills" id="skills">
                JavaScript <input type="checkbox" name="skills" id="skills">
                PHP <input type="checkbox" name="skills" id="skills">
                SQL <input type="checkbox" name="skills" id="skills">
            </label><br><br>
            <label for="collge">
                College: <input type="text" name="college" id="college" placeholder="Enter your college name">
            </label><br><br>
            <label for="uni">
                University: <input type="text" name="uni" id="uni" placeholder="Enter your university name">
            </label><br><br>
            <button type="input" onClick="display()">Display</button>
        </form>
    </div>
</body>
</html>
